name: Send Attendance Reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    concurrency:
      group: attendance-reminders-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: crm-bindzo8
          - environment: crm-designhub
          - environment: b8-aerooceanx-crm

    runs-on: ubuntu-24.04
    environment: ${{ matrix.environment }}
    steps:
      - name: Send attendance reminders
        env:
          APP_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          SALARY_CRON_SECRET: ${{ secrets.SALARY_CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$SALARY_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST "${APP_URL%/}/api/attendance/reminders/cron" \
            --header "Authorization: Bearer $SALARY_CRON_SECRET"

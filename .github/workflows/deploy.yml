name: Build & Deploy CRM

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write


# ============================================================
# BUILD
# ============================================================

jobs:
  build-and-push:

    strategy:
      matrix:
        include:
          - client: crm-bindzo8
            environment: crm-bindzo8
            image_tag: crm-bindzo8

          - client: crm-designhub
            environment: crm-designhub
            image_tag: crm-designhub

    runs-on: ubuntu-latest

    environment: ${{ matrix.environment }}

    steps:

      # ------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. Docker Buildx
      # ------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # 3. Login to GHCR
      # ------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------
      # 4. Build & Push
      # ------------------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6

        with:
          context: .
          push: true

          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.image_tag }}

          cache-from: type=gha,scope=${{ matrix.client }}
          cache-to: type=gha,mode=max,scope=${{ matrix.client }}

          # --------------------------------------------------
          # BuildKit secrets
          #
          # These are used by the Dockerfile during
          # `pnpm build`.
          #
          # NEXT_PUBLIC_* come from Environment Variables.
          # --------------------------------------------------

          secrets: |
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ vars.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
            NEXT_PUBLIC_APP_SCHEME=${{ vars.NEXT_PUBLIC_APP_SCHEME }}

            # Server value needed during build only if
            # your Dockerfile/build requires it.
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DIRECT_URL=${{ secrets.DIRECT_URL }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            CHROMIUM_REMOTE_EXEC_PATH=${{ secrets.CHROMIUM_REMOTE_EXEC_PATH }}
            EXCHANGE_RATE_API_KEY=${{ secrets.EXCHANGE_RATE_API_KEY }}
            



# ============================================================
# DEPLOY
# ============================================================

  deploy:

    needs:
      - build-and-push

    strategy:
      max-parallel: 1
      matrix:
        include:
          - client: crm-bindzo8
            environment: crm-bindzo8
            image_tag: crm-bindzo8
            app_dir: crm-bindzo8
            container_name: crm-bindzo8

          - client: crm-designhub
            environment: crm-designhub
            image_tag: crm-designhub
            app_dir: crm-designhub
            container_name: crm-designhub

    runs-on: ubuntu-latest

    environment: ${{ matrix.environment }}

    steps:

      # ------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. Prepare VPS
      # ------------------------------------------------------

      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            mkdir -p "$HOME/apps/${{ matrix.app_dir }}"

            docker network inspect web_network >/dev/null 2>&1 || \
              docker network create web_network


      # ------------------------------------------------------
      # 3. Copy Docker Compose
      # ------------------------------------------------------

      - name: Copy Docker Compose
        uses: appleboy/scp-action@v0.1.7

        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          source: "docker-compose.yml"
          target: "apps/${{ matrix.app_dir }}"


      # ------------------------------------------------------
      # 4. Deploy application
      # ------------------------------------------------------

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3

        env:

          # --------------------------------------------------
          # Public environment variables
          # --------------------------------------------------

          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ vars.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          NEXT_PUBLIC_APP_SCHEME: ${{ vars.NEXT_PUBLIC_APP_SCHEME }}

          # --------------------------------------------------
          # Server environment variables
          # --------------------------------------------------

          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

          CHROMIUM_REMOTE_EXEC_PATH: ${{ secrets.CHROMIUM_REMOTE_EXEC_PATH }}

          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}

          # --------------------------------------------------
          # GHCR
          # --------------------------------------------------

          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

        with:

          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          envs: >
            NEXT_PUBLIC_APP_NAME,
            NEXT_PUBLIC_SITE_URL,
            NEXT_PUBLIC_SUPPORT_EMAIL,
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET,
            NEXT_PUBLIC_APP_SCHEME,
            DATABASE_URL,
            DIRECT_URL,
            BETTER_AUTH_SECRET,
            BETTER_AUTH_URL,
            RESEND_API_KEY,
            MAIL_FROM,
            GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET,
            CHROMIUM_REMOTE_EXEC_PATH,
            EXCHANGE_RATE_API_KEY,
            GHCR_USERNAME,
            GHCR_TOKEN

          script: |

            set -e

            APP_DIR="$HOME/apps/${{ matrix.app_dir }}"

            cd "$APP_DIR"


            # ==================================================
            # Login to GHCR
            # ==================================================

            echo "Logging into GHCR..."

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin


            # ==================================================
            # Create production .env
            # ==================================================

            echo "Creating production .env..."

            cat > .env <<EOF

            GHCR_IMAGE_REPO=${{ github.repository }}
            IMAGE_TAG=${{ matrix.image_tag }}
            CONTAINER_NAME=${{ matrix.container_name }}

            NEXT_PUBLIC_APP_NAME=$NEXT_PUBLIC_APP_NAME
            NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_SUPPORT_EMAIL=$NEXT_PUBLIC_SUPPORT_EMAIL
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=$NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET
            NEXT_PUBLIC_APP_SCHEME=$NEXT_PUBLIC_APP_SCHEME

            DATABASE_URL=$DATABASE_URL
            DIRECT_URL=$DIRECT_URL

            BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
            BETTER_AUTH_URL=$BETTER_AUTH_URL

            RESEND_API_KEY=$RESEND_API_KEY
            MAIL_FROM=$MAIL_FROM

            GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET

            CHROMIUM_REMOTE_EXEC_PATH=$CHROMIUM_REMOTE_EXEC_PATH

            EXCHANGE_RATE_API_KEY=$EXCHANGE_RATE_API_KEY

            EOF


            # ==================================================
            # Pull latest image
            # ==================================================

            echo "Pulling image..."

            docker compose pull


            # ==================================================
            # Start application
            # ==================================================

            echo "Starting application..."

            docker compose up -d

            # ==================================================
            # Apply Migrations
            # ================================================== 

            echo "Running Prisma migrations..."

            docker compose exec -T web prisma migrate deploy

            # ==================================================
            # Remove old unused images
            # ==================================================

            echo "Cleaning old Docker images..."

            docker image prune -f


            # ==================================================
            # Status
            # ==================================================

            echo "Deployment completed."

            docker compose ps